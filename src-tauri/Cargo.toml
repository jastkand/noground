[package]
name = "noground"
version = "0.1.0"
description = "Local background removal"
authors = ["Andrey Krivko"]
edition = "2024"
default-run = "noground"

[lib]
name = "noground_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# exact pin — 2.0 rcs churn APIs between releases; defaults already
# include download-binaries + copy-dylibs + ndarray (static link on macOS)
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }

image = { version = "0.25", default-features = false, features = [
  "png", "jpeg", "webp", "tiff", "bmp", "gif",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls", "stream", "http2", "charset",
] }
futures-util = { version = "0.3", default-features = false }
sha2 = "0.11"
md-5 = "0.11"
anyhow = "1"
thiserror = "2"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
