name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dmg:
    # arm64 runner matches the rust-toolchain.toml pin (stable-aarch64-apple-darwin);
    # ort has no prebuilt ONNX Runtime binaries for x86_64-under-Rosetta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rustup picks up the pinned channel/target from rust-toolchain.toml
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      # own prefix, separate from build.yml's ci-profile cache; this one keeps
      # the full [profile.release] LTO artifacts used for published dmgs
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-v1

      - run: npm ci

      # the pushed tag is the single source of truth: stamp it into
      # tauri.conf.json (getVersion() in the sidebar, bundle metadata, dmg
      # filename) and Cargo.toml (CARGO_PKG_VERSION, which the CLI's
      # --version prints) so both match the release tag without a manual
      # version bump
      - name: Stamp version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version=process.env.VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          node -e "const fs=require('fs');const p='src-tauri/Cargo.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/^version = \".*\"$/m,'version = \"'+process.env.VERSION+'\"'))"
          grep '"version"' src-tauri/tauri.conf.json
          grep '^version' src-tauri/Cargo.toml

      # unsigned build on purpose — no signing identity configured; users click
      # through Gatekeeper per the README "Install" section
      - name: Build app bundle
        run: npm run tauri build

      - name: Checksum
        working-directory: src-tauri/target/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      # draft release: review the generated notes, attach anything else, then publish
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft --generate-notes --title "${GITHUB_REF_NAME}" \
            src-tauri/target/release/bundle/dmg/*.dmg \
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
